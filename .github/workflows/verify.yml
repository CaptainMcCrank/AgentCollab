name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Handshake fixture tests
        run: ./tests/run-tests.sh
      - name: Schema lint tests
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          ./tests/run-schema-tests.sh
      - name: Conformance grader self-test
        run: ./tests/run-conformance-selftest.sh
      - name: Reference implementation parity
        run: ./tests/run-impl-parity.sh
      - name: MCP server session test
        run: ./tests/run-mcp-tests.sh
      - name: Bundle verification
        # L2 (integrity + maintainer signature) once the signed manifest is
        # committed; falls back to L1 so pre-signing pushes still get integrity.
        run: |
          if [ -f PROTOCOL_MANIFEST.yaml.sig ]; then
            ./bin/agentcollab-verify.sh
          else
            echo "::warning::PROTOCOL_MANIFEST.yaml.sig missing — verifying at L1 only"
            ./bin/agentcollab-verify.sh --no-sig
          fi
